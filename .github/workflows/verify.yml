name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Skills are valid
        run: node scripts/skills.mjs check
      - name: Studio compiles
        run: for f in apps/studio/server.mjs apps/studio/lib/*.mjs apps/studio/public/*.js; do node --check "$f"; done
      - name: No API keys committed
        run: "! git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}' -- . ':!*.md'"
