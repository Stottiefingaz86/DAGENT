# Put this in the PRODUCT repo at .github/workflows/send-brd-to-design-repo.yml
# When a BRD is added or changed under brds/, it is copied into the design repo's inbox/.
# The Design Studio picks it up and opens a job. Needs a secret DESIGN_REPO_TOKEN
# (a fine-grained GitHub token with Contents: read & write on the design repo).
name: Send BRD to design
on:
  push:
    paths: ['brds/**']
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/checkout@v4
        with:
          repository: Stottiefingaz86/AI-Design-Stream
          token: ${{ secrets.DESIGN_REPO_TOKEN }}
          path: design
      - name: Copy changed BRDs into inbox/
        run: |
          mkdir -p design/inbox
          git diff --name-only --diff-filter=AM HEAD~1 HEAD -- brds/ | while read f; do cp "$f" design/inbox/; done
      - name: Commit
        run: |
          cd design
          git config user.name "brd-bot"
          git config user.email "brd-bot@users.noreply.github.com"
          git add inbox
          git diff --cached --quiet || (git commit -m "BRD from ${{ github.repository }}" && git push)
